name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: pc/taskmanager-pc
    steps:
      - uses: actions/checkout@v4
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        
      - name: install frontend dependencies
        run: npm install

      # Prepare signing key file using PowerShell (handles newlines correctly)
      - name: Prepare Signing Key
        shell: pwsh
        run: |
          $key = @"
          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          "@
          $key = $key.Trim()
          $keyPath = Join-Path -Path $PWD -ChildPath "tauri.key"
          $key | Out-File -FilePath $keyPath -Encoding ascii -NoNewline
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" >> $env:GITHUB_ENV

      # Build Tauri app
      - name: Build Tauri App
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # CRITICAL: Verify and DEBUG if no signatures
      - name: Verify Signatures
        shell: bash
        run: |
          SIG_FILES=$(find src-tauri/target/release/bundle/nsis -name "*.sig")
          if [ -z "$SIG_FILES" ]; then
            echo "::warning:: NO SIGNATURE FILES GENERATED BY BUILD! Attempting MANUAL signing..."
            EXE_PATH=$(find src-tauri/target/release/bundle/nsis -name "*setup.exe" | head -n 1)
            
            if [ -n "$EXE_PATH" ]; then
               npx tauri signer sign -f "$TAURI_SIGNING_PRIVATE_KEY_PATH" -p "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" "$EXE_PATH"
            else
               echo "::error:: Cannot find installer to sign manually."
               exit 1
            fi
            
            # Check again
            SIG_FILES=$(find src-tauri/target/release/bundle/nsis -name "*.sig")
            if [ -z "$SIG_FILES" ]; then
              echo "::error:: Manual signing also failed."
              exit 1
            fi
          fi
          echo "Signatures successfully verified."

      # Read version from tauri.conf.json
      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT

      # Robustly find the NSIS installer and its signature
      - name: Locate assets
        id: assets
        shell: bash
        run: |
          EXE_PATH=$(find src-tauri/target/release/bundle/nsis -name "*setup.exe" | head -n 1)
          SIG_PATH="${EXE_PATH}.sig"
          
          echo "exe_path=$EXE_PATH" >> $GITHUB_OUTPUT
          echo "exe_name=$(basename "$EXE_PATH")" >> $GITHUB_OUTPUT
          echo "sig_content=$(cat "$SIG_PATH")" >> $GITHUB_OUTPUT

      # Create the latest.json manually
      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SIG_CONTENT="${{ steps.assets.outputs.sig_content }}"
          EXE_NAME="${{ steps.assets.outputs.exe_name }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "TaskManager v${VERSION} release",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG_CONTENT}",
                "url": "https://github.com/zishan049/taskmanager-releases/releases/download/v${VERSION}/${EXE_NAME}"
              }
            }
          }
          EOF
          cat latest.json

      # Create release on the PUBLIC repo
      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: zishan049/taskmanager-releases
          tag_name: v${{ steps.version.outputs.version }}
          name: TaskManager v${{ steps.version.outputs.version }}
          body: "Release v${{ steps.version.outputs.version }} of TaskManager."
          draft: false
          prerelease: false
          files: |
            pc/taskmanager-pc/src-tauri/target/release/bundle/nsis/*.exe
            pc/taskmanager-pc/src-tauri/target/release/bundle/nsis/*.exe.sig
            pc/taskmanager-pc/latest.json
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: zishan049/taskmanager-releases
          tag_name: v${{ steps.version.outputs.version }}
          name: TaskManager v${{ steps.version.outputs.version }}
          body: "Release v${{ steps.version.outputs.version }} of TaskManager."
          draft: false
          prerelease: false
          files: |
            pc/taskmanager-pc/src-tauri/target/release/bundle/nsis/*.exe
            pc/taskmanager-pc/src-tauri/target/release/bundle/nsis/*.exe.sig
            pc/taskmanager-pc/latest.json
